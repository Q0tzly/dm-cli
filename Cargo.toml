[package]
name = "repom"
version = "0.3.1"
edition = "2024"
license = "MIT"
authors = ["Q0tzly <contact@q0tzly.dev>"]
description = "Context-aware repository manager for GitHub projects"
readme = "README.md"
repository = "https://github.com/Q0tzly/repom"
keywords = ["github", "cli", "repository", "manager", "ghq"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rem"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4.5.53"
dirs = "6.0.0"
ignore = "0.4.25"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"
