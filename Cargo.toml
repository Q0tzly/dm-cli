[package]
name = "dm-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "dm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
ignore = "0.4.25"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"
